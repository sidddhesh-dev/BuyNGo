{% extends 'base.html' %}
{% load static %}

{% block content %}

<link rel="stylesheet" href="{% static 'home/css/home.css' %}">

<main class="main">

<section class="hero">

    <div class="hero-container">

        <div class="hero-text">
            <h1>Step Into Style & Comfort</h1>

            <p>
                Discover premium footwear crafted for comfort, durability, 
                and everyday elegance.
            </p>

            <div class="hero-buttons">

                <a href="{% url 'product_list' %}">
                    <button class="btn primary-btn">
                        Shop Now
                    </button>
                </a>

                <a href="{% url 'developer' %}">
                    <button class="btn secondary-btn">
                        Developer
                    </button>
                </a>

            </div>
        </div>

        <div class="hero-image">
            <img src="https://thumbs.dreamstime.com/b/pair-men-s-casual-white-shoes-marble-background-pair-men-s-casual-white-shoes-marble-background-404782427.jpg" alt="Shoes">
        </div>

    </div>

</section>

</main>

{% endblock %}
